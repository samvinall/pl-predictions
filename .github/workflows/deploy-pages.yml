name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages. Replaces the legacy "deploy from a
# branch" build, whose overlapping deployments kept cancelling each other in the
# shared github-pages environment ("Error: Deployment cancelled"). The
# concurrency group below serialises deployments -- a new one waits for the
# current to finish rather than cancelling it -- so every merge publishes.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queue (don't cancel) any that overlap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # the site is served from the repo root
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
