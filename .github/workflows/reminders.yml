name: Deadline Reminders

# Sends "make your pick" emails ~24h before each gameweek deadline. Runs on a
# schedule; send_reminders.py de-dupes (config/reminders) so it never emails
# twice for the same gameweek, and no-ops if the SMTP secrets aren't set.
on:
  schedule:
    - cron: '30 */2 * * *'   # every 2 hours, offset from the data sync
  workflow_dispatch:
    inputs:
      test_to:
        description: "Test only: send one sample email to this address (leave blank for a normal run)"
        required: false
        default: ""

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests firebase-admin "google-cloud-firestore==2.28.1" "google-api-core==2.34.0" "google-cloud-core==2.6.1" "google-auth==2.56.3"  # pinned to the last green run; api-core 2.35 sends an invalid "(default)" db id (400)

      - name: Write Firebase service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json

      - name: Send deadline reminders
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          TEST_TO: ${{ inputs.test_to }}
        run: python send_reminders.py
